name: Bounded Python chapter scraper
on:
  push:
    branches: ['feature/cloudflare-vercel-durable-jobs-foundation']
  pull_request:
jobs:
  scraper-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q core main.py sites
      - run: python -m unittest discover -s tests -p 'test_automation.py' -v
